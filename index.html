<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/arive-prompt-generator/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>arive-prompt-generator</title>
    <script type="module" crossorigin src="/arive-prompt-generator/assets/index-BseqV7a1.js"></script>
    <link rel="stylesheet" crossorigin href="/arive-prompt-generator/assets/index-CiTLShdZ.css">
  </head>
  <body>
    <div id="password-gate" style="position:fixed;inset:0;z-index:9999;background:#1a1a2e;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif">
      <div style="background:#16213e;border:1px solid #334;border-radius:12px;padding:2rem;max-width:360px;width:90%;text-align:center">
        <h2 style="color:#fff;margin:0 0 .5rem">ARiVE Prompt Generator</h2>
        <p style="color:#888;font-size:.875rem;margin:0 0 1.5rem">パスワードを入力してください</p>
        <input type="password" id="pw-input" placeholder="パスワード" style="width:100%;padding:.75rem;border-radius:8px;border:1px solid #445;background:#0f1629;color:#fff;text-align:center;font-size:1rem;box-sizing:border-box;margin-bottom:1rem" onkeydown="if(event.key==='Enter')checkPw()">
        <button onclick="checkPw()" style="width:100%;padding:.75rem;border-radius:8px;border:none;background:#e94560;color:#fff;font-weight:bold;font-size:1rem;cursor:pointer">入る</button>
        <p id="pw-error" style="color:#e94560;font-size:.875rem;margin:.75rem 0 0;display:none">パスワードが違います</p>
      </div>
    </div>
    <script>
    const PW_HASH="b99b47f7f2ee863db0f22accc15aa2ed1715b5c300bb53612aaef2ce403a2a07";
    async function sha256(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("")}
    async function checkPw(){const h=await sha256(document.getElementById("pw-input").value);if(h===PW_HASH){localStorage.setItem("arive-pg-auth",h);document.getElementById("password-gate").style.display="none"}else{document.getElementById("pw-error").style.display="block"}}
    if(localStorage.getItem("arive-pg-auth")===PW_HASH){document.getElementById("password-gate").style.display="none"}else{document.getElementById("pw-input").focus()}
    </script>
    <div id="root"></div>
  </body>
</html>
